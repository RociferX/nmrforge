# NMRForge 默认配置（config/nmrforge.local.yaml 可本地覆盖，勿提交敏感信息）
# 只保留有运行时消费者的配置段(DEAD-014,2026-09-12):
# backend / processing / smile 之外的无消费者段已删除。

backend:
  provider: nmrpipe            # 当前生产后端;未实现的 provider 不再列出
  nmrpipe:
    nmrpipe_bin: ""            # 留空自动查找（PATH → csh 环境 → 常见目录）
    path: ""                   # 显式 NMRPipe bin 目录/可执行文件(优先于 nmrpipe_bin;可空)

processing:
  linewidth_hz:                # 间接维自动填零目标线宽(核素 → Hz),显式 params 可覆盖
    1H: 8
    15N: 15
    13C: 20
  points_per_line: 2.0         # 目标数字点距 = max(线宽, 1/AQ)/points_per_line
  ext_lo: "10.5"                 # 直接维提取窗口高端(EXT -x1),默认 10.5 ppm
  ext_hi: "6.5"                  # 直接维提取窗口低端(EXT -xn),默认 6.5 ppm
  intermediate_memory: auto      # auto=内存余量充足时中间谱工作目录放内存盘;off=始终磁盘
  memory_disk_path: ""           # 可选:内存盘根目录(默认 Linux /dev/shm;Windows 自建 RAM 盘后指定)

peaks:
  # 峰定位(peak localization,2026-09-13):检测之后的亚格点精修方法。
  # 消费者:core/peaks/localize.py::load_localization_defaults(选峰/GUI/API)。
  localization:
    method: parabolic           # parabolic(默认,既有 3 点抛物线) | gaussian(仅 2D)
    gaussian_roi_f1_ppm: 1.5    # 高斯拟合 ROI 半径(间接维 F1,ppm,物理宽度)
    gaussian_roi_f2_ppm: 0.25   # 高斯拟合 ROI 半径(直接维 F2,ppm,物理宽度)

smile:
  nthread: 2                   # SMILE 线程数(默认 2;上限=机器核数-2,≤3核只能 1;0 同样回退安全默认 2)
