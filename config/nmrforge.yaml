# NMRForge 默认配置（config/nmrforge.local.yaml 可本地覆盖，勿提交敏感信息）
app:
  name: NMRForge
  version: 0.1.0

backend:
  provider: nmrpipe            # nmrpipe | native
  nmrpipe:
    nmrpipe_bin: ""            # 留空自动查找（PATH → csh 环境 → 常见目录）
    path: ""                   # 显式 NMRPipe bin 目录/可执行文件(优先于 nmrpipe_bin;可空)

processing:
  linewidth_hz:                # 间接维自动填零目标线宽(核素 → Hz),显式 params 可覆盖
    1H: 8
    15N: 15
    13C: 20
  points_per_line: 2.0         # 目标数字点距 = max(线宽, 1/AQ)/points_per_line

smile:
  nthread: 0                   # 0=自动(机器线程数-2);正整数=固定;大网格仍护栏强制 ≤2

optimization:
  budget:
    max_candidates: 8
    max_runtime_min: 15
    early_stop_improvement: 0.01
    max_no_improvement: 2

qc:
  contour_levels_sigma: [1.5, 2.0, 3.0, 5.0]
  peak_min_snr: 3.0

reporting:
  formats: [json, html]
  recipe: true

logging:
  level: INFO
