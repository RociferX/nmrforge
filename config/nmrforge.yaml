# NMRForge 默认配置（config/nmrforge.local.yaml 可本地覆盖，勿提交敏感信息）
app:
  name: NMRForge
  version: 0.1.0

backend:
  provider: nmrpipe            # nmrpipe | native
  nmrpipe:
    nmrpipe_bin: ""            # 留空自动查找（PATH → csh 环境 → 常见目录）
    path: ""                   # 显式 NMRPipe bin 目录/可执行文件(优先于 nmrpipe_bin;可空)

processing:
  linewidth_hz:                # 间接维自动填零目标线宽(核素 → Hz),显式 params 可覆盖
    1H: 8
    15N: 15
    13C: 20
  points_per_line: 2.0         # 目标数字点距 = max(线宽, 1/AQ)/points_per_line
  ext_lo: "10.5"                 # 直接维提取窗口高端(EXT -x1),默认 10.5 ppm
  ext_hi: "6.5"                  # 直接维提取窗口低端(EXT -xn),默认 6.5 ppm
  intermediate_memory: auto      # auto=内存余量充足时中间谱工作目录放内存盘;off=始终磁盘
  memory_disk_path: ""           # 可选:内存盘根目录(默认 Linux /dev/shm;Windows 自建 RAM 盘后指定)

smile:
  nthread: 0                   # 0=自动(机器线程数-offset);正整数=固定;大网格仍护栏强制 ≤2
  thread_offset: 2             # 自动线程预留数(机器线程数 - thread_offset,0.2.199-补24)

optimization:
  budget:
    max_candidates: 8
    max_runtime_min: 15
    early_stop_improvement: 0.01
    max_no_improvement: 2

qc:
  contour_levels_sigma: [1.5, 2.0, 3.0, 5.0]
  peak_min_snr: 3.0

reporting:
  formats: [json, html]
  recipe: true

logging:
  level: INFO
